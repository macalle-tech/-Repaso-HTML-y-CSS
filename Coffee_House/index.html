<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Coffee House</title>
</head>

<body>
    <header>
        <h1>Coffee House</h1>
    </header>

    <main>
        <!--imagen representativa-->
        <img src="img/cafeteria_parisina.png" alt="Coffee House"  class="imagen-cafe">

        <!--menu de productos-->
        <h2>Nuestro Menu</h2>
        <div class="menu">

            <div class="producto">
                <h3>Cafe Americano</h3>
                <p>Cafe negro suave uy aromatizado</p>
                <p class="precio">$ 5.000</p>
            </div>

            <div class="producto">
                <h3>Capuchino</h3>
                <p>Espresso con leche espumada</p>
                <p class="precio">$ 7.000</p>
            </div>

            <div class="producto">
                <h3>Mocaccino</h3>
                <p>Cafe con mocoa y chocolate en leche</p>
                <p class="precio">$ 8.500</p>
            </div>

        </div>

        <button class="botoncontacto">Contactanos</button>

    </main>

    <footer>
        <p>Desarrollado por: Mario Andres Calle<br>
           Unitecnica Jornada noche<br>Grupo 1191</p>
    </footer>
</body>

</html>
